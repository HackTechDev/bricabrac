<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Bric-à-Brac : une bille dévale une rampe vers un panier suspendu à une poulie. -->
  <rect x="2" y="2" width="124" height="124" rx="20" fill="#1d2b45" stroke="#0f1a2e" stroke-width="4"/>
  <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5">
    <path d="M34 4v120M64 4v120M94 4v120M4 34h120M4 64h120M4 94h120"/>
  </g>
  <!-- Corde -->
  <g fill="none" stroke="#e8d9b5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M98 26V66"/>
    <path d="M77 86L98 66L119 86"/>
  </g>
  <!-- Poulie -->
  <circle cx="98" cy="24" r="13" fill="#7f8fa6" stroke="#0f1a2e" stroke-width="3"/>
  <circle cx="98" cy="24" r="4" fill="#0f1a2e"/>
  <!-- Panier -->
  <path d="M77 86V114H119V86" fill="#ffc94d" fill-opacity="0.16"/>
  <path d="M77 86V114H119V86" fill="none" stroke="#0f1a2e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M77 86V114H119V86" fill="none" stroke="#ffc94d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Support et rampe -->
  <path d="M24 56L38 112H10Z" fill="#7f8fa6" stroke="#0f1a2e" stroke-width="3" stroke-linejoin="round"/>
  <rect x="-38" y="-5.5" width="76" height="11" rx="2" transform="translate(44 64) rotate(26.57)" fill="#c98f4e" stroke="#0f1a2e" stroke-width="3"/>
  <!-- Bille -->
  <circle cx="41" cy="41" r="14" fill="#4da3ff" stroke="#0f1a2e" stroke-width="3"/>
  <path d="M33 45L49 37" stroke="#0f1a2e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="36" cy="35" r="3" fill="#ffffff" fill-opacity="0.8"/>
</svg>
